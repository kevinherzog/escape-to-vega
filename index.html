<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1210">
<title>Escape to Vega</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vega">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
:root {
  /* Portrait console: one column of instrument panels; in combat a vertical radar lane between enemy (top) and Albatross (bottom) */
  --bg: #d6ddd7;          /* console paint, green-grey */
  --panel: #edf1ec;       /* instrument panel */
  --panel-2: #e0e7e1;     /* recessed fields */
  --ink: #17201a;
  --muted: #53615a;
  --line: #b2bfb5;
  --signal: #c94a17;      /* signal orange: primary actions */
  --signal-ink: #fff8f2;
  --brass: #855d00;       /* scrap */
  --shield: #1d6aa6;
  --ok: #2a7a45;
  --warn: #a86a00;
  --crit: #bb2e29;
  --focus: #1d6aa6;
  /* Radar screen: stays dark in both themes */
  --screen: #070b08;
  --screen-2: #0f1611;
  --screen-ink: #ffb547;
  --screen-dim: #6e5631;
  --screen-grid: rgba(255, 181, 71, 0.07);
  --foe: #ff6040;
  --w-laser: #ff6a3d;
  --w-ion: #5cc8ff;
  --w-missile: #ffd166;
  --w-beam: #c49bff;
  --w-flak: #ffe39a;
  --shield-screen: #5cc8ff;
  --bonus-screen: #d9c2ff;
  --rep-screen: #7be495;

  --font-display: "Big Shoulders Stencil", "Big Shoulders Stencil Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-ui: "Chakra Petch", Roboto, "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Roboto Mono", "SFMono-Regular", Menlo, monospace;

  --r: 4px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 1px 2px rgba(23, 32, 26, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1210; --panel: #161c18; --panel-2: #1d2520; --ink: #e1e8e0; --muted: #8f9d93; --line: #2c3630;
    --signal: #ff6a2b; --signal-ink: #1b0c03; --brass: #e2ad3f; --shield: #5bb5f2;
    --ok: #52c47a; --warn: #f0a83a; --crit: #ff5e56; --focus: #5bb5f2;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 1px 2px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1210; --panel: #161c18; --panel-2: #1d2520; --ink: #e1e8e0; --muted: #8f9d93; --line: #2c3630;
  --signal: #ff6a2b; --signal-ink: #1b0c03; --brass: #e2ad3f; --shield: #5bb5f2;
  --ok: #52c47a; --warn: #f0a83a; --crit: #ff5e56; --focus: #5bb5f2;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 1px 2px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-ui);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 0; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -16px; padding: 10px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
}
.top-route { font: 600 12px/1.2 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 9px; height: 9px; border: 1.5px solid var(--muted); border-radius: 50%; }
.pip.done { background: var(--muted); }
.pip.now { border-color: var(--signal); background: var(--signal); }
.pip.gate { border-radius: 2px; transform: rotate(45deg); width: 8px; height: 8px; }
.scrap { display: inline-flex; align-items: center; gap: 5px; color: var(--brass); font: 600 16px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.top .hull { grid-column: 1 / -1; }

/* ---------- Hull bar ---------- */
.hull { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.hull-label { font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.bar { position: relative; height: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width 0.25s ease; }
.bar > i[data-s="warn"] { background: var(--warn); }
.bar > i[data-s="crit"] { background: var(--crit); }
.bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--panel) calc(10% - 1px) 10%); opacity: 0.55; }
.hull-num { font: 600 13px/1 var(--font-data); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }

/* ---------- Panels ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 14px 14px 14px;
  display: flex; flex-direction: column; gap: 10px;
  background-image:
    radial-gradient(circle at 7px 7px, var(--line) 1.6px, transparent 2.2px),
    radial-gradient(circle at calc(100% - 7px) 7px, var(--line) 1.6px, transparent 2.2px);
}
.plate { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-inline: 8px; }
.plate h2 { margin: 0; font: 600 12px/1.2 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.plate .meta { font: 600 12px/1.2 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.pad { padding-inline: 8px; }
[hidden] { display: none !important; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  min-height: 48px; padding: 10px 14px; border-radius: var(--r);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 15px/1.2 var(--font-ui); cursor: pointer; touch-action: manipulation; text-align: center;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn-block { width: 100%; }
.btn-small { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.btn:focus-visible, .card:focus-visible, .choice:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.cost { display: inline-flex; align-items: center; gap: 3px; font: 600 14px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.btn-primary .cost { color: inherit; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.row-actions .btn { flex: 1 1 140px; }

/* ---------- Ship stats ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.stat { background: var(--panel-2); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat dt { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat dd { margin: 0; font: 600 15px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }
.stat dd small { font: 500 12px/1.2 var(--font-ui); color: var(--muted); }

/* ---------- Weapons ---------- */
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wrow {
  display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px;
  text-align: left; width: 100%;
}
button.wrow { cursor: pointer; }
.wrow[aria-pressed="true"] { border-color: var(--signal); }
.wdot { width: 10px; height: 10px; border-radius: 50%; background: var(--w-laser); box-shadow: 0 0 0 2px var(--panel); }
.wdot[data-k="ion"] { background: var(--w-ion); }
.wdot[data-k="missile"] { background: var(--w-missile); }
.wdot[data-k="beam"] { background: var(--w-beam); }
.wdot[data-k="flak"] { background: var(--w-flak); }
.wdot[data-k="heavy"] { background: var(--w-laser); border-radius: 2px; }
.wname { font-weight: 600; }
.wdesc { grid-column: 2 / 3; font-size: 13px; color: var(--muted); }
.wtime { font: 600 13px/1.2 var(--font-data); color: var(--muted); grid-row: 1 / 3; grid-column: 3; text-align: right; }
.wrow.empty { border-style: dashed; color: var(--muted); grid-template-columns: 1fr; }
.sellbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Crew ---------- */
.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card {
  appearance: none; text-align: left; cursor: pointer; width: 100%;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 10px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.card[aria-pressed="true"] { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cname { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.stars { color: var(--brass); letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
.tags { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag .ic { color: var(--muted); }
.eff { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.card.empty { cursor: default; border-style: dashed; background: transparent; color: var(--muted); align-items: center; justify-content: center; min-height: 96px; font-size: 13px; }

/* ---------- Synergies ---------- */
.syn { display: flex; flex-direction: column; gap: 6px; }
.synrow { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 10px; align-items: center; }
.synrow .ic { color: var(--muted); }
.synrow.on .ic { color: var(--signal); }
.synname { font-weight: 600; font-size: 14px; }
.syneff { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
.synrow.on .syneff { color: var(--ink); }
.cells { display: inline-flex; gap: 3px; }
.cells i { width: 12px; height: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.cells i.f { background: var(--muted); border-color: var(--muted); }
.synrow.on .cells i.f { background: var(--signal); border-color: var(--signal); }
.cells i:nth-child(2) { margin-right: 4px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); padding-block: 4px; }
details.more[open] summary { margin-bottom: 6px; }

/* ---------- Run report ---------- */
.exportbox { width: 100%; font: 500 11px/1.4 var(--font-data); background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r); padding: 8px; resize: vertical; -webkit-user-select: text; user-select: text; }

/* ---------- Difficulty picker ---------- */
.diffs { display: flex; flex-direction: column; gap: 6px; }
.diffrow { align-items: flex-start; text-align: left; flex-direction: column; gap: 2px; padding: 10px 12px; }
.diffrow[aria-pressed="true"] { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
.diffrow .diffname { font-weight: 700; }
.diffrow small { font: 500 12.5px/1.3 var(--font-ui); color: var(--muted); }
.diffrow.on small { color: var(--ink); }

.rellist { display: flex; flex-direction: column; gap: 8px; }
.relrow { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 10px; align-items: center; }
.relrow .ic { color: var(--signal); }
.relname { font-weight: 600; font-size: 14px; }
.reldesc { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.opt.relopt { border-color: var(--signal); }
.opt.relopt > span { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
   ==========================================================================

/* ---------- Recruit ---------- */
.offers { display: flex; flex-direction: column; gap: 6px; }
.offer {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 8px 8px 12px;
}
.offer.sold { opacity: 0.5; }
.otype { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 600; font-size: 14px; }
.oeff { font-size: 12.5px; color: var(--muted); }
.badge { display: inline-block; font: 600 11px/1.3 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }
.badge.hot { border-color: var(--signal); color: var(--signal); }
.badge.syn { border-color: var(--shield); color: var(--shield); }
.badge.double { border-color: var(--signal); background: var(--signal); color: var(--signal-ink); font-weight: 700; }
.offer .btn { min-width: 64px; grid-row: 1 / 4; grid-column: 2; }
.offer > .otype, .offer > .oeff, .offer > .obadges { grid-column: 1; min-width: 0; }
.obadges { display: flex; flex-wrap: wrap; gap: 4px; }
.obadges .badge { margin-right: 0; }

/* ---------- Upgrades ---------- */
.upgs { display: flex; flex-direction: column; }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 0 8px 8px; border-top: 1px solid var(--line); }
.upg:first-child { border-top: 0; }
.upg b { font-size: 14px; }
.upg span { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.upg .btn { grid-row: 1 / 3; grid-column: 2; min-width: 72px; }

/* ---------- Footer ---------- */
.foot {
  position: sticky; bottom: 0; z-index: 5; margin-top: auto;
  margin-inline: -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center;
}
.foot .note { flex: 1; min-width: 0; }
.foot .btn { flex: none; }

/* ---------- Radar screen (title, map, combat) ---------- */
.screen {
  position: relative; overflow: hidden; border-radius: var(--r);
  background:
    radial-gradient(ellipse at 50% 50%, var(--screen-2) 0%, var(--screen) 75%);
  color: var(--screen-ink);
  border: 1px solid var(--line);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
}
.screen::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--screen-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--screen-grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
}

/* ---------- Title ---------- */
.title-hero { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.eyebrow { font: 600 12px/1.2 var(--font-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--signal); margin: 0; }
.display { font: 800 clamp(48px, 15vw, 72px)/0.9 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 16px; max-width: 34em; }
.route-screen { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.route { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 10px; }
.route .seg { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.route .seg-l { font: 500 10.5px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--screen-dim); white-space: nowrap; }
.route .seg-d { position: relative; height: 12px; display: flex; align-items: center; justify-content: space-between; }
.route .seg-d::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--screen-dim); }
.route .dot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--screen); border: 1.5px solid var(--screen-ink); }
.route .dot.done { background: var(--screen-ink); }
.route .dot.here { background: var(--screen-ink); box-shadow: 0 0 0 4px rgba(255, 181, 71, 0.25); }
.route .gate { width: 9px; height: 9px; border-radius: 1px; transform: rotate(45deg); }
.route .start { height: 12px; display: flex; align-items: center; color: var(--screen-ink); }
.route .start .ic { width: 16px; height: 16px; }
.route .vega { height: 12px; display: flex; align-items: center; font: 700 14px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--screen-ink); text-shadow: 0 0 10px rgba(255, 181, 71, 0.7); }
.route-foot { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 8px; font: 500 11px/1.2 var(--font-data); letter-spacing: 0.06em; color: var(--screen-dim); }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14.5px; }
.rules .ic { color: var(--signal); margin-top: 2px; }
.record { font: 500 13px/1.4 var(--font-data); color: var(--muted); }

/* ---------- Star map ---------- */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  appearance: none; width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 40px 1fr auto; gap: 2px 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px 14px;
}
.choice .ic { width: 28px; height: 28px; grid-row: 1 / 3; color: var(--ink); }
.choice[data-t="elite"] .ic, .choice[data-t="guardian"] .ic, .choice[data-t="boss"] .ic { color: var(--crit); }
.choice[data-t="shop"] .ic, .choice[data-t="dock"] .ic { color: var(--ok); }
.choice[data-t="event"] .ic { color: var(--shield); }
.choice b { font-size: 16px; }
.choice span { font-size: 13px; color: var(--muted); grid-column: 2; }
.choice .go { grid-row: 1 / 3; grid-column: 3; color: var(--signal); width: 22px; height: 22px; }
.choice:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- Event ---------- */
.ev-title { margin: 0; font: 800 34px/1 var(--font-display); text-transform: uppercase; padding-inline: 8px; }
.ev-text { margin: 0; font-size: 16px; padding-inline: 8px; }
.ev-out { margin: 0; font-size: 16px; padding: 12px 14px; background: var(--panel-2); border-left: 3px solid var(--signal); border-radius: 2px; }
.opt { display: flex; flex-direction: column; align-items: stretch; text-align: left; gap: 2px; padding: 12px 14px; }
.opt small { font: 500 13px/1.3 var(--font-ui); color: var(--muted); }
.opt.btn-primary small { color: inherit; opacity: 0.85; }

/* ---------- Loot ---------- */
.gains { display: flex; flex-direction: column; gap: 6px; padding-inline: 8px; font-size: 16px; }
.gains .num { font-weight: 600; }
.loot { display: grid; grid-template-columns: 1fr; gap: 8px; }

/* ---------- Combat ---------- */
.combat { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.sidep { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; box-shadow: var(--shadow); }
.sidep-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sidep-name { font: 800 22px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; overflow-wrap: anywhere; }
.sidep-name.foe { color: var(--crit); }
.sidep-meta { font: 600 12px/1.2 var(--font-data); color: var(--muted); white-space: nowrap; }
.spips { display: flex; gap: 4px; align-items: center; min-height: 14px; flex-wrap: wrap; }
.spip { width: 18px; height: 10px; border: 1.5px solid var(--shield); border-radius: 2px; position: relative; overflow: hidden; }
.spip.on { background: var(--shield); }
.spip > i { position: absolute; inset: 0 auto 0 0; background: var(--shield); opacity: 0.35; }
.spip.bonus { border-style: dashed; border-color: var(--muted); }
.spip.bonus.on { background: var(--muted); }
.spip.lock { border-color: var(--crit); }
.slabel { font: 600 11px/1 var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.wcharge { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 4px 10px; }
.wc { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.wc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wc .cb { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.wc .cb > i { display: block; height: 100%; width: 100%; background: var(--signal); transform-origin: left; transform: scaleX(0); }

.lane { height: clamp(240px, calc(100vh - 380px), 520px); height: clamp(240px, calc(100svh - 380px), 520px); }
.lane .ship { position: absolute; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; z-index: 1; }
.lane .ship svg { width: 100%; height: 100%; overflow: visible; }
.ship-e { top: 19%; color: var(--foe); }
.ship-p { top: 81%; color: var(--screen-ink); }
.ship.boss { width: 92px; height: 92px; }
.shipart path { fill: currentColor; fill-opacity: 0.14; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.shipart .glow { fill: none; stroke-dasharray: 2 3; opacity: 0.8; }
.bubble { position: absolute; inset: -14px -18px; border-radius: 50%; border: 2px solid var(--shield-screen); opacity: 0; transition: opacity 0.2s; box-shadow: 0 0 12px rgba(92, 200, 255, 0.35), inset 0 0 12px rgba(92, 200, 255, 0.25); }
.bubble.bonus { inset: -20px -24px; border-style: dashed; border-color: var(--bonus-screen); box-shadow: none; }
.ship.hit { animation: shake 0.28s linear; }
.ship.hit svg { filter: drop-shadow(0 0 6px var(--foe)); }
.ship.blk .bubble { opacity: 1 !important; }
@keyframes shake { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(calc(-50% - 4px), -50%); } 50% { transform: translate(calc(-50% + 3px), calc(-50% + 1px)); } 75% { transform: translate(calc(-50% - 2px), -50%); } }
.shots, .fxl { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.shot { position: absolute; width: 4px; height: 14px; margin: -7px 0 0 -2px; border-radius: 2px; background: var(--w-laser); box-shadow: 0 0 8px var(--w-laser); }
.shot.e { background: var(--foe); box-shadow: 0 0 8px var(--foe); }
.shot[data-k="ion"] { background: var(--w-ion); box-shadow: 0 0 10px var(--w-ion); width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; }
.shot[data-k="missile"] { background: var(--w-missile); box-shadow: 0 0 10px var(--w-missile); width: 5px; height: 16px; }
.shot[data-k="flak"] { background: var(--w-flak); box-shadow: 0 0 6px var(--w-flak); width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 1px; }
.beam { position: absolute; width: 3px; margin-left: -1.5px; background: var(--w-beam); box-shadow: 0 0 12px var(--w-beam); border-radius: 2px; }
.fx { position: absolute; transform: translate(-50%, -50%); font: 700 15px/1 var(--font-data); white-space: nowrap; text-shadow: 0 0 8px rgba(0, 0, 0, 0.9); animation: rise 0.95s ease-out forwards; }
.fx.dmg { color: var(--foe); font-size: 18px; }
.fx.dmg.p { color: #ff8a6a; }
.fx.blk { color: var(--shield-screen); }
.fx.miss { color: var(--screen-dim); }
.fx.ion { color: var(--w-ion); }
.fx.rep { color: var(--rep-screen); }
@keyframes rise { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, calc(-50% - 28px)); } }
.lane-msg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 3; font: 600 12px/1.2 var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--screen-ink); pointer-events: none; }
.lane-msg.intro { animation: fadeout 1.6s ease-in forwards; font: 800 26px/1 var(--font-display); letter-spacing: 0.04em; }
.lane-heat { position: absolute; left: 8px; top: 8px; z-index: 3; font: 600 10.5px/1 var(--font-data); letter-spacing: 0.1em; color: var(--foe); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes fadeout { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
.ctrl { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.speed { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.speed button { appearance: none; border: 0; border-right: 1px solid var(--line); background: var(--panel-2); min-width: 48px; min-height: 48px; font: 600 14px/1 var(--font-data); cursor: pointer; }
.speed button:last-child { border-right: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.fleebtn { flex: 1; position: relative; overflow: hidden; }
.noflee { flex: 1; align-self: center; }
.fleebtn .fill { position: absolute; inset: 0 auto 0 0; background: var(--line); opacity: 0.6; transform-origin: left; }
.fleebtn span { position: relative; }
.cend { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(7, 11, 8, 0.82); text-align: center; padding: 16px; }
.cend b { font: 800 44px/0.95 var(--font-display); letter-spacing: 0.03em; text-transform: uppercase; }
.cend b.win { color: var(--screen-ink); }
.cend b.lose { color: var(--foe); }
.cend p { margin: 0; font: 500 13px/1.4 var(--font-data); color: var(--screen-ink); }

/* ---------- End ---------- */
.end-hero { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
.end-hero .display.lose { color: var(--crit); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 480px); pointer-events: none; }
.toast { background: var(--ink); color: var(--panel); font: 600 14px/1.3 var(--font-ui); padding: 10px 14px; border-radius: var(--r); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); animation: toast 2.6s ease forwards; text-align: center; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .ship.hit { animation: none; }
  .fx { animation: fadeout 0.95s linear forwards; }
  .lane-heat { animation: none; }
  .bar > i { transition: none; }
}
@media (min-width: 520px) {
  .loot { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}

<script>
/* Escape to Vega – game logic (pure, no DOM). Runs in the browser and in Node. */
var VEGA = (function () {
  'use strict';

  // ---------- Randomness ----------
  var rnd = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seed(s) { rnd = mulberry32(s >>> 0); }
  function unseed() { rnd = Math.random; }
  var R = {
    f: function () { return rnd(); },
    int: function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(rnd() * arr.length)]; },
    chance: function (p) { return rnd() < p; },
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
  };

  // ---------- Constants ----------
  var C = {
    START_HULL: 30,
    SHIELD_REGEN: 6,          // seconds per shield layer
    SECTOR_LEN: 5,            // normal jumps per sector, then guardian/flagship
    SECTORS: 3,
    CREW_PRICE: 3,
    REROLL_PRICE: 2,
    SHIELD_COST: { 2: 14, 3: 22, 4: 32 },
    ENGINE_COST: { 2: 6, 3: 9, 4: 12, 5: 16, 6: 20 },
    CAP_COST: { 5: 5, 6: 7, 7: 9, 8: 11 },
    SLOT_COST: 14,
    REPAIR_PRICE: 3, REPAIR_AMOUNT: 4,
    DOCK_HEAL: 12,
    FLEE_CHARGE: 18,          // seconds until the jump drive is ready to flee
    INTEREST_STEP: 10, INTEREST_MAX: 5,
    EVASION_CAP: 60,
    HEAT_START: 32,           // shield generators start overheating past this point
    HEAT_RAMP: 12,            // every 12 s, shields charge a multiple slower
    BREAKDOWN: 240,           // emergency brake: structural damage to both sides after this
    SELL: [2, 7, 22]
  };

  // ---------- Data ----------
  var ROLES = {
    gunner:   { name: 'Gunner',     plural: 'Gunners' },
    pilot:    { name: 'Pilot',      plural: 'Pilots' },
    tech:     { name: 'Technician', plural: 'Technicians' },

  };
  var ORIGINS = {
    human: { name: 'Human',       plural: 'Humans' },
    rock:  { name: 'Crystalline', plural: 'Crystallines' },
    bug:   { name: 'Insectoid',   plural: 'Insectoids' },
    spark: { name: 'Energy Being', plural: 'Energy Beings' }
  };
  var ROLE_KEYS = ['gunner', 'pilot', 'tech', 'engineer'];
  var ORIGIN_KEYS = ['human', 'rock', 'bug', 'spark'];
  var NAMES = {
    human: ['Ada', 'Bram', 'Cleo', 'Dario', 'Ella', 'Finn', 'Greta', 'Hugo', 'Ines', 'Jonas', 'Kira', 'Lars', 'Mila', 'Nico', 'Oskar', 'Pia', 'Rosa', 'Theo'],

    spark: ['Lumen', 'Volta', 'Flux', 'Aura', 'Nova', 'Zeta', 'Glimm', 'Funke', 'Ohm', 'Lux', 'Plasma', 'Ampere']
  };

  // Effect per crew member by star rank (1, 2, 3)
  var ROLE_VAL = {
    gunner:   [0.07, 0.15, 0.30],   // + weapon charge speed
    pilot:    [4, 9, 16],           // + evasion percentage points
    tech:     [0.18, 0.38, 0.70],   // + shield charge speed

  var SYNERGIES = [

  };

  /* RELICS_APPLIED */
  var RELICS = {
    /* ---- tier 1: solid, always useful ---- */
    lathe:    { key: 'lathe',    tier: 1, name: 'Salvage Lathe',
                desc: 'Every 5 damage you deal pays 1 scrap.', per: 5 },
    ledger:   { key: 'ledger',   tier: 1, name: 'Syndicate Ledger',
                desc: 'Each won fight pays 15 % interest on your scrap (max +8).', rate: 0.15, cap: 8 },
    welder:   { key: 'welder',   tier: 1, name: 'Weld Drone',
                desc: 'In-combat repair fixes 2 hull per cycle, and runs even with no engineer.', amt: 2, every: 14 },
    veil:     { key: 'veil',     tier: 1, name: 'Phase Veil',
                desc: 'Beams can miss you (half evasion). Every dodge charges all weapons +4 %.', half: 0.5, charge: 0.04 },
    blackbox: { key: 'blackbox', tier: 1, name: 'Black Box',
                desc: 'One extra loot choice. Trading posts stock a fourth weapon.' },

    /* ---- tier 2: changes how a fight plays out ---- */
    coil:     { key: 'coil',     tier: 2, name: 'Coil Spring',
                desc: 'Your first shield layer recharges in 1.2 s.', sec: 1.2 },
    spike:    { key: 'spike',    tier: 2, name: 'Ion Spike',
                desc: 'Your ion hits also jam an enemy weapon for 4 s.', sec: 4 },
    cascade:  { key: 'cascade',  tier: 2, name: 'Cascade Capacitor',
                desc: 'A shield of yours breaking fires your most-charged weapon at once.', cd: 1.2 },
    reactor:  { key: 'reactor',  tier: 2, name: 'Hoard Reactor',
                desc: 'While you hold 40+ scrap: +1 shield layer, weapons start 60 % charged.', need: 40, start: 0.6, shield: 1 },

    /* ---- tier 3: build payoffs. these are meant to break the game ---- */
    hive:     { key: 'hive',     tier: 3, name: 'Hive Resonator',
                desc: 'With 4 Insectoids: boarding damage doubled, +1 more per 2 aboard.', mul: 2, per: 2, base: 9, need: 4 },
    chorus:   { key: 'chorus',   tier: 3, name: 'Chorus Engine',
                desc: 'While 4 of one origin are aboard: +40 % weapon charge and +2 shield layers.', charge: 0.40, shield: 2 },
    prism:    { key: 'prism',    tier: 3, name: 'Prism Lens',
                desc: 'Your beams fire twice and ignore 2 enemy shields.', pierce: 2 }
  };

  var RELIC_KEYS = ['lathe', 'ledger', 'welder', 'veil', 'blackbox', 'coil', 'spike', 'cascade', 'reactor', 'hive', 'chorus', 'prism'];
  var RELIC_PRICE = { 1: 12, 2: 20, 3: 32 };
  /* Drop weight per tier, by sector: commons early, legendaries late. Tier 3 is
     kept deliberately scarce — these are the run-breaking payoffs, and they are
     meant to be a story you tell afterwards, not a thing you plan around. */
  var RELIC_W = { 1: [79, 20, 1], 2: [62, 36, 2], 3: [50, 46, 4] };

  function hasRelic(s, k) { return !!(s.relics && s.relics.indexOf(k) >= 0); }
  function relicPrice(k) { return RELIC_PRICE[RELICS[k].tier]; }
  function relicsOwned(s) {
    return (s.relics || []).filter(function (k) { return !!RELICS[k]; }).map(function (k) { return RELICS[k]; });
  }
  function relicPool(s, minTier) {
    return RELIC_KEYS.filter(function (k) { return RELICS[k].tier >= (minTier || 1) && !hasRelic(s, k); });
  }
  function rollRelic(s, minTier) {
    var pool = relicPool(s, minTier || 1);
    if (!pool.length && (minTier || 1) > 1) pool = relicPool(s, 1);
    if (!pool.length) return null;
    var w = RELIC_W[Math.min(C.SECTORS, s.sector)] || RELIC_W[1];
    var tot = 0, i;
    for (i = 0; i < pool.length; i++) tot += w[RELICS[pool[i]].tier - 1];
    var r = R.f() * tot;
    for (i = 0; i < pool.length; i++) { r -= w[RELICS[pool[i]].tier - 1]; if (r < 0) return pool[i]; }
    return pool[pool.length - 1];
  }
  function addRelic(s, k) {
    if (!RELICS[k]) return null;
    if (!s.relics) s.relics = [];
    if (s.relics.indexOf(k) < 0) s.relics.push(k);
    return RELICS[k];
  }
  /* relic flags that the combat hooks read off a side object */
  function relicCombat(s) {
    return {
      coil:      hasRelic(s, 'coil')    ? RELICS.coil.sec     : 0,
      spike:     hasRelic(s, 'spike')   ? RELICS.spike.sec    : 0,
      cascade:   hasRelic(s, 'cascade') ? RELICS.cascade.cd   : 0,
      veil:      hasRelic(s, 'veil')    ? RELICS.veil.half    : 0,
      veilCharge:hasRelic(s, 'veil')    ? RELICS.veil.charge  : 0,
      prism:     hasRelic(s, 'prism')   ? RELICS.prism.pierce : 0
    };

        } },
      { label: 'Leave it broadcasting', run: function () { return { text: 'You route around the static.' }; } }
    ]; } },

  { id: 'debris', title: 'Debris Storm', text: 'A field of broken hull plating and ice tumbles across your bow, leftovers from some older fight.',
    choices: function () { return [
      { label: 'Fly through and salvage', hint: 'Safe with 2+ gunners', run: function (s) {
          var g = R.int(7, 11);
          gainScrap(s, g);
          if ((counts(s).gunner || 0) >= 2) return { text: 'Your gunners blast a clean lane through the debris. +' + g + ' scrap.' };
          var d = hurt(s, R.int(3, 6));
          return { text: 'Shrapnel rattles the hull as you haul in scrap. +' + g + ' scrap, -' + d + ' hull.' };
        } },
      { label: 'Steer around', run: function () { return { text: 'You add ten slow minutes to the route and keep the hull intact.' }; } }
    ]; } },

  { id: 'overclock', title: 'Redline', text: 'Your engineer thinks the drive core can take more than the safety margin allows.',
    choices: function () { return [
      { label: 'Push it past redline', hint: '50/50 — engine +1 stage or hull damage', req: function (s) { return s.engineLv < 6; }, why: 'Engine already at maximum',
        run: function (s) {
          if (R.chance(0.5)) { s.engineLv++; return { text: 'The core screams and settles into a new, higher pitch. Engine +1 stage.' }; }
          var d = hurt(s, R.int(5, 8));
          return { text: 'A feedback spike slams through the conduits. -' + d + ' hull.' };
        } },
      { label: 'Leave the margin alone', run: function () { return { text: 'Some risks are not worth the paperwork.' }; } }
    ]; } },

  { id: 'capacitor', title: 'Salvaged Capacitor', text: 'A trader offers a scavenged shield capacitor, pulled from a hull nobody will name.',
    choices: function () { return [
      { label: 'Test-fit it', cost: 6, req: function (s) { return s.scrap >= 6 && s.shieldLv < 4; }, why: 'Shields already at maximum',
        run: function (s) {
          s.scrap -= 6;
          if (R.chance(0.6)) { s.shieldLv++; return { text: 'It syncs with your grid on the first try. Shields +1 stage.' }; }
          gainScrap(s, 3);
          return { text: 'It arcs, smokes, and dies. You strip it for +3 scrap and call it even.' };
        } },
      { label: 'Pass', run: function () { return { text: 'The trader shrugs and packs it away.' }; } }
    ]; } },

  { id: 'vault', title: 'Sealed Vault', text: 'A derelict beacon marks a cargo vault, locked tight and still broadcasting a corporate seal.',
    choices: function () { return [
      { label: 'Force it open', cost: 8, req: function (s) { return s.scrap >= 8; },
        run: function (s) {
          s.scrap -= 8;
          var r = R.f();
          if (r < 0.15) {
            var bonus = 8; gainScrap(s, bonus);
            var k = R.pick(['heavy', 'missile', 'beam', 'flak']);
            return weaponFound(s, k, 'Under the ration crates sits a crated ' + WEAPONS[k].name + ', plus ' + bonus + ' loose scrap.');
          }
          if (r < 0.7) { var g = R.int(10, 16); gainScrap(s, g); return { text: 'The seal gives way to a hold full of parts. +' + g + ' scrap.' }; }
          return { text: 'Empty. Someone beat you to it.' };
        } },
      { label: 'Bypass the lock', hint: 'Free with 2+ technicians', req: function (s) { return (counts(s).tech || 0) >= 2; }, why: 'Needs 2 technicians to read the lock',
        run: function (s) { var g = R.int(8, 12); gainScrap(s, g); return { text: 'Your technicians walk the lock back through its own handshake. +' + g + ' scrap.' }; } },
      { label: 'Leave it sealed', run: function () { return { text: 'Whatever is inside is not worth a hull breach.' }; } }
    ]; } },

  { id: 'choir', title: 'Spark Choir', text: 'A cluster of drifting energy motes pulses in slow rhythm with your reactor hum.',
    setup: function () { return { role: R.pick(ROLE_KEYS) }; },
    choices: function (s, ctx) { return [
      { label: 'Reach out', hint: 'Joins for free if a spark is already aboard', run: function (s) {
          if ((counts(s).spark || 0) >= 1 && canRecruit(s, ctx.role, 'spark')) return { text: recruitText(addCrew(s, ctx.role, 'spark')) };
          var g = R.int(5, 9); gainScrap(s, g);
          return { text: 'The motes dim and scatter, leaving charged residue behind. +' + g + ' scrap.' };
        } },
      { label: 'Let them drift on', run: function () { return { text: 'The hum fades behind you.' }; } }
    ]; } },

  { id: 'armory', title: 'Sealed Armory', text: 'A listening beacon marks a weapons cache, locked to a code that expired years ago.',
    choices: function () { return [
      { label: 'Cut it open', run: function (s) {
          if (R.chance(0.75)) { var k = R.pick(['laser', 'burst', 'heavy', 'ion', 'missile']); return weaponFound(s, k, 'Inside sits a crated ' + WEAPONS[k].name + ', still in its packing foam.'); }
          var d = hurt(s, R.int(4, 7));
          return { text: 'The seal was wired to a charge. -' + d + ' hull.' };
        } },
      { label: 'Leave it sealed', run: function () { return { text: 'Expired codes make good booby traps. You leave it be.' }; } }
    ]; } },

  { id: 'bay', title: 'Cargo Bay Refit', text: 'Dock workers at a half-abandoned yard offer to carve out another weapon mount, cash not required.',
    choices: function () { return [
      { label: 'Let them weld through the hull', hint: 'Costs hull, not scrap', req: function (s) { return s.slots < 4; }, why: 'No room left for another mount',
        run: function (s) { var d = hurt(s, R.int(4, 7)); s.slots++; return { text: 'Sparks fly for an hour and a new mount scars the plating. -' + d + ' hull, +1 weapon slot.' }; } },
      { label: 'Decline', run: function () { return { text: 'Your hull stays in one piece.' }; } }
    ]; } },

  { id: 'bazaar', title: 'Floating Bazaar', text: 'A ragtag flotilla has strung market stalls between docked hulls. A dealer waves you toward a weapon rack.',
    setup: function () { return { k: R.pick(['laser', 'burst', 'heavy', 'ion', 'missile', 'beam']) }; },
    choices: function (s, ctx) {
      var discount = (counts(s).human || 0) >= 1;
      var price = Math.max(3, WEAPONS[ctx.k].price - (discount ? 2 : 0));
      return [
        { label: 'Buy the ' + WEAPONS[ctx.k].name, hint: discount ? 'Haggled price' : '', cost: price, req: function (s) { return s.scrap >= price; },
          run: function (s) { s.scrap -= price; return weaponFound(s, ctx.k, 'The dealer hands over a ' + WEAPONS[ctx.k].name + '.'); } },
        { label: 'Walk past', run: function () { return { text: 'You keep your scrap and your hull plating.' }; } }
      ];
    } },

  { id: 'den', title: 'Gambling Den', text: 'A makeshift den runs dice games off a docked hab-ring. The house always seems to win, but tonight might be different.',
    choices: function () { return [
      { label: 'Wager 10 scrap', cost: 10, req: function (s) { return s.scrap >= 10; },
        run: function (s) {
          s.scrap -= 10;
          if (R.chance(0.48)) { gainScrap(s, 20); return { text: 'The dice favor you, for once. +20 scrap.' }; }
          return { text: 'The house wins again. Your scrap is already gone.' };
        } },
      { label: 'Watch from the bar', run: function () { return { text: 'You nurse a drink while a Syndicate ensign loses badly at the next table.' }; } }
    ]; } },
  { id: 'relicvault', title: 'Sealed Vault', text: 'A derelict survey ship drifts past with its cargo vault still sealed. The lock is syndicate work.',
    setup: function (s) { return { k: rollRelic(s, 1) }; },
    choices: function (s, ctx) { return [
      { label: 'Cut the vault open', hint: ctx.k ? RELICS[ctx.k].name : 'Nothing left in there', cost: 4,
        req: function (s) { return s.scrap >= 4 && !!ctx.k; },
        why: ctx.k ? 'Not enough scrap' : 'The vault is already stripped',
        run: function (s) {
          s.scrap -= 4; addRelic(s, ctx.k);
          return { text: 'The seal gives way. ' + RELICS[ctx.k].name + ' is bolted to the Albatross. ' + RELICS[ctx.k].desc };
        } },
      { label: 'Strip the hull instead', hint: '+12 scrap',
        run: function (s) { gainScrap(s, 12); return { text: 'You cut loose everything within reach. +12 scrap.' }; } },
      { label: 'Fly on', run: function () { return { text: 'Some locks are not worth the time.' }; } }
    ]; } }
  ];
  /* NEW_EVENTS_APPLIED */
  var EVENT_BY_ID = {};
  EVENTS.forEach(function (e) { EVENT_BY_ID[e.id] = e; });

  function startEvent(s) {
    var left = EVENTS.filter(function (e) { return s.usedEvents.indexOf(e.id) < 0; });
    if (!left.length) { s.usedEvents = []; left = EVENTS.slice(); }
    var ev = R.pick(left);
    s.usedEvents.push(ev.id);
    return { id: ev.id, ctx: ev.setup ? ev.setup(s) : {} };
  }
  function eventView(s, inst) {
    var ev = EVENT_BY_ID[inst.id];
    var choices = ev.choices(s, inst.ctx).map(function (ch) {
      var ok = ch.req ? ch.req(s) : true;
      return { label: ch.label, hint: ch.hint || '', cost: ch.cost || 0, gain: ch.gain || 0, ok: ok, why: ok ? '' : (ch.why || 'Not enough scrap'), run: ch.run };
    });
    return { title: ev.title, text: ev.text, choices: choices };
  }
  function chooseEvent(s, inst, i) {
    var view = eventView(s, inst);
    var ch = view.choices[i];
    if (!ch || !ch.ok) return null;
    return ch.run(s);
  }

  return {
    C: C, ROLES: ROLES, ORIGINS: ORIGINS, ROLE_KEYS: ROLE_KEYS, ORIGIN_KEYS: ORIGIN_KEYS, ROLE_VAL: ROLE_VAL,
    SYNERGIES: SYNERGIES, WEAPONS: WEAPONS, NODES: NODES, EVENTS: EVENTS,
    seed: seed, unseed: unseed, R: R,
    newRun: newRun, counts: counts, tierOf: tierOf, maxHull: maxHull, syncHull: syncHull, derive: derive, roleEffect: roleEffect,
    rollShop: rollShop, canRecruit: canRecruit, wouldMerge: wouldMerge, copies: copies, buyCrew: buyCrew, sellCrew: sellCrew, reroll: reroll, addCrew: addCrew,
    upgradeCost: upgradeCost, upgrade: upgrade,
    weaponValue: weaponValue, sellWeapon: sellWeapon, replaceWeapon: replaceWeapon, giveWeapon: giveWeapon,
    genBeacons: genBeacons, interest: interest, jumpTo: jumpTo, afterNode: afterNode, dock: dock,
    makeEnemy: makeEnemy, startCombat: startCombat, heatFactor: heatFactor, stepCombat: stepCombat, flee: flee, endCombat: endCombat,
    makeLoot: makeLoot, takeLoot: takeLoot,
    makeStore: makeStore, storeBuy: storeBuy, repair: repair, buySlot: buySlot,
    DIFFS: DIFFS, diffOf: diffOf, repairPrice: repairPrice,
    RELICS: RELICS, RELIC_KEYS: RELIC_KEYS,
    hasRelic: hasRelic, addRelic: addRelic, rollRelic: rollRelic,
    relicPrice: relicPrice, relicsOwned: relicsOwned, storeBuyRelic: storeBuyRelic,
    startEvent: startEvent, eventView: eventView, chooseEvent: chooseEvent, typeLabel: typeLabel
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = VEGA;

</script>
<script>
/* Escape to Vega – UI */
(function () {
  'use strict';
  var L = VEGA, C = L.C;
  var STEP = 0.05;
  var SAVE_KEY = 'fnv-save-v1', REC_KEY = 'fnv-record-v1', SPEED_KEY = 'fnv-speed-v1';
  var DIFF_KEY = 'fnv-diff-v1', UNLOCK_KEY = 'fnv-unlock-v1';
  var Y_E = 19, Y_P = 81;

  var S = {
    run: null, screen: 'title',
    combat: null, result: null,
    event: null, eventOut: null,
    store: null, reward: null, replace: null, dockHeal: 0,
    sel: { crew: null, weapon: null },
    synOpen: false,
    speed: 2,
    diff: 0,
    log: [], exportText: null
  };

  // ---------- Storage (all optional) ----------
  function put(key, val) { try { if (val === undefined) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* no storage */ } }
  function get(key) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function saveRun() { if (S.run && !S.run.dead && !S.run.won) put(SAVE_KEY, S.run); }
  function clearRun() { put(SAVE_KEY, undefined); }
  function savedRun() { var r = get(SAVE_KEY); return r && r.v === 1 && r.crew && !r.dead && !r.won ? r : null; }
  function record() { return get(REC_KEY) || { runs: 0, wins: 0, best: 0 }; }
  function addRecord(won) {
    var r = record();
    r.runs++; if (won) r.wins++;
    r.best = Math.max(r.best || 0, won ? 4 : S.run.sector);
    put(REC_KEY, r);
    // Winning opens the next rung of the ladder.
    if (won) {
      var lv = (S.run && S.run.diff) || 0;
      if (lv >= unlocked() && lv + 1 < L.DIFFS.length) put(UNLOCK_KEY, lv + 1);
    }
  }
  function unlocked() { var u = get(UNLOCK_KEY); return typeof u === 'number' && u > 0 ? Math.min(u, L.DIFFS.length - 1) : 0; }
  function pickedDiff() { var d = get(DIFF_KEY); return Math.min(typeof d === 'number' ? d : 0, unlocked()); }

  // ---------- Building blocks ----------
  var ROLE_IC = { gunner: 'i-gunner', pilot: 'i-pilot', tech: 'i-tech', engineer: 'i-engineer' };
  var ORIGIN_IC = { human: 'i-human', rock: 'i-rock', bug: 'i-bug', spark: 'i-spark' };
  var NODE_IC = { fight: 'i-fight', elite: 'i-elite', event: 'i-event', shop: 'i-shop', dock: 'i-dock', guardian: 'i-guardian', boss: 'i-boss' };
  var RELIC_IC = {
    lathe: 'i-scrap', ledger: 'i-coin', welder: 'i-engineer', veil: 'i-pilot', blackbox: 'i-event',
    coil: 'i-tech', spike: 'i-spark', cascade: 'i-spark', reactor: 'i-scrap',
    hive: 'i-bug', chorus: 'i-human', prism: 'i-gunner'
  };
  var RELIC_TIER = { 1: 'Common', 2: 'Rare', 3: 'Prime' };
  function relicBadge(r) {
    var cls = r.tier === 3 ? ' double' : r.tier === 2 ? ' syn' : '';
    return '<span class="badge' + cls + '">' + RELIC_TIER[r.tier] + '</span>';
  }
  function ic(id, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function cost(n) { return '<span class="cost">' + ic('i-scrap') + n + '</span>'; }
  function fmt(x, d) { return x.toFixed(d == null ? 1 : d); }
  function stars(n) { return '<span class="stars" aria-label="' + n + (n === 1 ? ' star' : ' stars') + '">' + new Array(n + 1).join('★') + '</span>'; }
  function hullState(f) { return f > 0.5 ? 'ok' : f > 0.25 ? 'warn' : 'crit'; }
  function $(sel) { return document.querySelector(sel); }
  function tags(role, origin) {
    return '<span class="tag">' + ic(ROLE_IC[role]) + L.ROLES[role].name + '</span><span class="tag">' + ic(ORIGIN_IC[origin]) + L.ORIGINS[origin].name + '</span>';
  }

  var SHIP_P = '<svg class="shipart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 L39 20 L39 34 L58 46 L58 52 L39 49 L37 58 L27 58 L25 49 L6 52 L6 46 L25 34 L25 20 Z"/><path d="M29 22 h6 v8 h-6 z"/><path class="glow" d="M28 60 L27 64 M36 60 L37 64"/></svg>';
  var SHIP_E = '<svg class="shipart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 61 L42 44 L60 38 L54 24 L41 27 L38 6 L26 6 L23 27 L10 24 L4 38 L22 44 Z"/><path d="M28 30 h8 v7 h-8 z"/></svg>';
  var SHIP_B = '<svg class="shipart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 63 L40 50 L62 44 L62 30 L46 32 L44 10 L36 2 L28 2 L20 10 L18 32 L2 30 L2 44 L24 50 Z"/><path d="M26 16 h12 v10 h-12 z"/><path d="M22 36 h20 v6 h-20 z"/></svg>';

  function hullBar(h, mh) {
    var f = Math.max(0, h) / mh;
    return '<div class="hull"><span class="hull-label">Hull</span><div class="bar"><i style="width:' + (f * 100).toFixed(1) + '%" data-s="' + hullState(f) + '"></i></div><span class="hull-num">' + Math.max(0, h) + ' / ' + mh + '</span></div>';
  }
  function topBar() {
    var s = S.run, pips = '';
    for (var i = 1; i <= C.SECTOR_LEN + 1; i++) {
      pips += '<i class="pip' + (i === C.SECTOR_LEN + 1 ? ' gate' : '') + (i <= s.jump ? ' done' : '') + (i === s.jump + 1 && S.screen !== 'combat' && !s.node ? ' now' : '') + '"></i>';
    }
    return '<header class="top">' +
      '<div class="top-route">Sector ' + s.sector + ' of 3' + (s.diff ? ' · ' + L.diffOf(s).name : '') + ' <span class="pips" role="img" aria-label="' + s.jump + ' of ' + (C.SECTOR_LEN + 1) + ' jumps completed">' + pips + '</span></div>' +
      '<div class="scrap">' + ic('i-scrap') + '<span class="num">' + s.scrap + '</span><span class="sr"> Scrap</span></div>' +
      hullBar(s.hull, L.maxHull(s)) +
      '</header>';
  }
  function footBar(note, btn) { return '<footer class="foot"><p class="note">' + note + '</p>' + btn + '</footer>'; }
  function panel(title, meta, inner) {
    return '<section class="panel"><div class="plate"><h2>' + title + '</h2>' + (meta ? '<span class="meta">' + meta + '</span>' : '') + '</div>' + inner + '</section>';
  }

  // ---------- Title ----------
  function routeScreen(run) {
    var segs = '';
    for (var sec = 1; sec <= C.SECTORS; sec++) {
      var dots = '';
      for (var j = 1; j <= C.SECTOR_LEN + 1; j++) {
        var done = run && (sec < run.sector || (sec === run.sector && j <= run.jump));
        var here = run && sec === run.sector && j === run.jump;
        dots += '<i class="dot' + (j === C.SECTOR_LEN + 1 ? ' gate' : '') + (done ? ' done' : '') + (here ? ' here' : '') + '"></i>';
      }
      segs += '<div class="seg"><span class="seg-l">Sector ' + sec + '</span><div class="seg-d">' + dots + '</div></div>';
    }
    return '<div class="screen route-screen" aria-hidden="true"><div class="route">' +
      '<span class="start">' + ic('i-hull') + '</span>' + segs + '<span class="vega">Vega</span></div>' +
      '<div class="route-foot"><span>18 jumps</span><span>' + (run ? 'Albatross: Sector ' + run.sector + ', Jump ' + run.jump : 'Albatross ready to launch') + '</span></div></div>';
  }
  // Difficulty picker. Only rungs the player has earned are selectable; the
  // next one is shown locked so the ladder is visible from the start.
  function panelDiff() {
    var max = unlocked(), cur = pickedDiff();
    var rows = L.DIFFS.map(function (D, i) {
      if (i > max + 1) return '';
      var locked = i > max;
      return '<button class="btn diffrow' + (i === cur && !locked ? ' on' : '') + '" data-a="diff" data-v="' + i +
        '"' + (locked ? ' disabled' : '') + ' aria-pressed="' + (i === cur && !locked) + '">' +
        '<span class="diffname">' + D.name + (locked ? ' · locked' : '') + '</span>' +
        '<small>' + (locked ? 'Win ' + L.DIFFS[i - 1].name + ' to unlock' : D.blurb) + '</small></button>';
    }).join('');
    return panel('Difficulty', L.DIFFS[cur].name, '<div class="diffs">' + rows + '</div>');
  }
  function viewTitle() {
    var saved = savedRun(), rec = record();
    var actions = saved
      ? '<button class="btn btn-primary" data-a="continue">Continue Flight</button><button class="btn" data-a="new">New Flight</button>'
      : '<button class="btn btn-primary btn-block" data-a="new">New Flight</button>';
    return '<section class="title-hero">' +
        '<p class="eyebrow">Courier Mission · 3 Sectors</p>' +
        '<h1 class="display">Escape to Vega</h1>' +
        '<p class="lead">You fly the Albatross with the last copy of the Star Archive on board. The Syndicate wants it back. Get it to Vega.</p>' +
      '</section>' +
      routeScreen(saved) +
      panelDiff() +
      '<div class="row-actions">' + actions + '</div>' +
      panel('How a Flight Works', '', '<ul class="rules">' +
        '<li>' + ic('i-jump') + '<span>At each jump point you choose the next destination: combat, event, trading post, or space dock.</span></li>' +
        '<li>' + ic('i-fight') + '<span>Battles play out on their own. Each weapon fires as soon as it’s charged, and each shield layer absorbs one hit.</span></li>' +
        '<li>' + ic('i-human') + '<span>Between jumps you recruit crew. Three of a kind merge into one member with more stars.</span></li>' +
        '<li>' + ic('i-spark') + '<span>Two or four <em>different</em> crew sharing a role or origin unlock synergies. A type you already have adds nothing to the count — duplicates are only good for merging.</span></li>' +
        '<li>' + ic('i-coin') + '<span>Saved-up scrap earns interest: +1 per 10 scrap, up to +5 per jump.</span></li>' +
      '</ul>') +
      (rec.runs ? '<p class="record">' + rec.runs + (rec.runs === 1 ? ' flight' : ' flights') + ' so far · Vega reached: ' + rec.wins + '× · farthest flight: ' + (rec.best > 3 ? 'Vega' : 'Sector ' + rec.best) + '</p>' : '');
  }

  // ---------- Hangar ----------
  function panelShip(s, d) {
    var items = [
      ['Shields', d.shieldMax + '<small> ' + (d.shieldMax === 1 ? 'layer' : 'layers') + (d.bonusShields ? ' + ' + d.bonusShields + ' extra' : '') + '</small>'],
      ['Shield Charge', fmt(d.shieldRegen) + '<small> s per layer</small>'],
      ['Evasion', d.evasion + '<small> %</small>'],
      ['Weapon Speed', '+' + Math.round((d.chargeMul - 1) * 100) + '<small> %</small>'],
      ['Repair', d.repairEvery ? '1<small> hull per ' + fmt(d.repairEvery) + ' s</small>' : '–'],
      ['Boarding Party', d.boarding ? d.boarding.dmg + '<small> damage per ' + d.boarding.every + ' s</small>' : '–']
    ];
    return panel('Albatross', 'Shields Lv. ' + s.shieldLv + ' · Engine Lv. ' + s.engineLv,
      '<dl class="stats">' + items.map(function (it) { return '<div class="stat"><dt>' + it[0] + '</dt><dd>' + it[1] + '</dd></div>'; }).join('') + '</dl>');
  }
  function panelWeapons(s, d) {
    var rows = s.weapons.map(function (k, i) {
      var W = L.WEAPONS[k], sel = S.sel.weapon === i;
      var html = '<button class="wrow" data-a="selw" data-v="' + i + '" aria-pressed="' + sel + '">' +
        '<i class="wdot" data-k="' + k + '"></i><span class="wname">' + W.name + '</span>' +
        '<span class="wtime">' + fmt(W.charge / d.chargeMul) + ' s</span>' +
        '<span class="wdesc">' + W.desc + '</span></button>';
      if (sel) {
        html += '<div class="sellbar"><span class="note">' + (s.weapons.length <= 1 ? 'The last weapon stays on board.' : 'Removing it earns ' + L.weaponValue(k) + ' scrap.') + '</span>' +
          '<button class="btn btn-small" data-a="sellw" data-v="' + i + '"' + (s.weapons.length <= 1 ? ' disabled' : '') + '>Remove</button></div>';
      }
      return html;
    }).join('');
    for (var j = s.weapons.length; j < s.slots; j++) rows += '<div class="wrow empty">Empty slot · Weapons available at the trading post</div>';
    return panel('Weapons', s.weapons.length + '/' + s.slots + ' · Charge Time', '<div class="wlist">' + rows + '</div>');
  }
  function panelCrew(s) {
    var cards = s.crew.map(function (m) {

  function viewCombat() {

    var speed = [1, 2, 4].map(function (n) { return '<button data-a="speed" data-v="' + n + '" aria-pressed="' + (S.speed === n) + '">' + n + '×</button>'; }).join('');

  function bindCombat() {

  function pipsHtml(sd) {

    }

      var bon = j < sd.bonus;

  function drawCombat(c) {

      var hk = sd.hull + '/' + sd.maxHull;
      if (hk !== r.hkey) { r.hkey = hk; r.hb.innerHTML = hullBar(sd.hull, sd.maxHull); }

      for (var i = 0; i < sd.w.length; i++) if (r.w[i]) r.w[i].style.transform = 'scaleX(' + Math.min(1, sd.w[i].p).toFixed(3) + ')';

  function startLoop() {

  // ---------- Trading post ----------
function viewStore() {
    var s = S.run, st = S.store, mh = L.maxHull(s);
    var offers = st.offers.map(function (o, i) {
      var W = L.WEAPONS[o.k];
      return '<div class="offer' + (o.sold ? ' sold' : '') + '"><span class="otype"><span class="tag"><i class="wdot" data-k="' + o.k + '"></i>' + W.name + '</span></span>' +
        '<span class="oeff">' + W.desc + ' · charges in ' + W.charge + ' s</span>' +
        (o.sold ? '<button class="btn btn-small" disabled>Bought</button>'
          : '<button class="btn btn-small" data-a="sbuy" data-v="' + i + '"' + (s.scrap >= o.price ? '' : ' disabled') + '>' + cost(o.price) + '</button>') + '</div>';
    }).join('');
    var relicPanel = '';                                                      // NEW
    if (st.relic) {
      var rl = L.RELICS[st.relic.k];
      relicPanel = panel('Relic', RELIC_TIER[rl.tier],
        '<div class="offers"><div class="offer' + (st.relic.sold ? ' sold' : '') + '">' +
        '<span class="otype"><span class="tag">' + ic(RELIC_IC[rl.key]) + rl.name + '</span></span>' +
        '<span class="oeff">' + rl.desc + '</span>' +
        /* full .btn (48 px), not .btn-small: a relic is a bigger decision than a weapon */
        (st.relic.sold ? '<button class="btn" disabled>Bought</button>'
          : '<button class="btn" data-a="sbuyrel"' + (s.scrap >= st.relic.price ? '' : ' disabled') + '>' + cost(st.relic.price) + '</button>') +
        '</div></div>');
    }
    return topBar() +
      panel('Trading Post', 'Weapons ' + s.weapons.length + '/' + s.slots,
        '<p class="note pad">' + (s.weapons.length >= s.slots ? 'All slots full: a new weapon replaces an old one; the old one earns half its price.' : 'Purchased weapons are installed immediately.') + '</p>' +
        '<div class="offers">' + offers + '</div>') +
      relicPanel +                                                            // NEW
      panel('Shipyard', '',
        '<div class="upgs"><div class="upg"><b>Patch Hull</b><span>+' + C.REPAIR_AMOUNT + ' hull · now ' + s.hull + ' / ' + mh + '</span><button class="btn btn-small" data-a="srep"' + (s.scrap >= L.repairPrice(s) && s.hull < mh ? '' : ' disabled') + '>' + cost(L.repairPrice(s)) + '</button></div>' +
        '<div class="upg"><b>Install Weapon Slot</b><span>' + (s.slots >= 4 ? 'Already 4 slots' : 'Room for a fourth weapon') + '</span><button class="btn btn-small" data-a="sslot"' + (s.slots < 4 && s.scrap >= C.SLOT_COST ? '' : ' disabled') + '>' + (s.slots >= 4 ? 'Max.' : cost(C.SLOT_COST)) + '</button></div></div>') +
      footBar('Crew and upgrades are available in the hangar.', '<button class="btn btn-primary" data-a="sdone">Depart ' + ic('i-go') + '</button>');
  }

  // ---------- Replace weapon ----------
  function viewReplace() {
    var s = S.run, rp = S.replace, W = L.WEAPONS[rp.k];
    var rows = s.weapons.map(function (k, i) {
      return '<button class="btn opt" data-a="rep" data-v="' + i + '"><span>Remove ' + L.WEAPONS[k].name + '</span><small>earns ' + L.weaponValue(k) + ' scrap · ' + L.WEAPONS[k].desc + '</small></button>';
    }).join('');
    return topBar() +
      panel('All Weapon Slots Full', '', '<h1 class="ev-title">' + W.name + '</h1><p class="ev-text">' + W.desc + '. Which weapon should make room for it?</p>') +
      '<div class="choices">' + rows + '</div>' +
      '<button class="btn" data-a="repskip">' + (rp.refund ? 'Don’t buy it after all · ' + rp.refund + ' scrap refunded' : 'Leave ' + W.name + ' behind') + '</button>';
  }

  // ---------- Space dock & end ----------
  function viewDock() {
    return topBar() + panel('Space Dock', '', '<h1 class="ev-title">Shipyard in Orbit</h1><p class="ev-text">' +
      (S.dockHeal > 0 ? 'The dock crew patches your hull. +' + S.dockHeal + ' hull.' : 'The dock crew finds not a scratch and treats you to a coffee.') + '</p>') +
      footBar('', '<button class="btn btn-primary" data-a="ddone">Continue ' + ic('i-go') + '</button>');
  }
  function endStats(s) {
    var items = [['Wins', s.stats.wins], ['Escapes', s.stats.fled], ['Scrap collected', s.stats.scrap], ['Jumps', s.stats.jumps]];
    var crew = s.crew.map(function (m) { return m.name + ' ' + new Array(m.stars + 1).join('★'); }).join(', ');
    return panel('Logbook', '', '<dl class="stats">' + items.map(function (it) { return '<div class="stat"><dt>' + it[0] + '</dt><dd>' + it[1] + '</dd></div>'; }).join('') + '</dl><p class="note pad">Crew: ' + crew + '</p>' +
      '<button class="btn" data-a="export">Copy run report</button>');
  }
  function viewOver() {
    var s = S.run;
    return '<section class="end-hero"><p class="eyebrow">Flight Ended</p><h1 class="display lose">Albatross Lost</h1>' +
      '<p class="lead">You made it to Sector ' + s.sector + ', Jump ' + s.jump + '.</p></section>' + endStats(s) +
      '<div class="row-actions"><button class="btn btn-primary" data-a="new">New Flight</button><button class="btn" data-a="title">Title Screen</button></div>';
  }
  function viewWin() {
    var s = S.run;
    return '<section class="end-hero"><p class="eyebrow">Mission Accomplished</p><h1 class="display">Vega Reached</h1>' +
      '<p class="lead">The Star Archive is safe. The Albatross lands with ' + s.hull + ' hull.</p></section>' + endStats(s) +
      '<div class="row-actions"><button class="btn btn-primary" data-a="new">New Flight</button><button class="btn" data-a="title">Title Screen</button></div>';
  }

  // ---------- Flow ----------
  function resetUi() {
    S.combat = null; S.result = null; S.event = null; S.eventOut = null; S.store = null; S.reward = null; S.replace = null;
    S.sel = { crew: null, weapon: null };
    loopId++;
  }
  function enterNode(type) {
    logNode(type);
    if (type === 'fight' || type === 'elite' || type === 'guardian' || type === 'boss') startFight(type, {});
    else if (type === 'event') { S.event = L.startEvent(S.run); S.eventOut = null; go('event'); }
    else if (type === 'shop') { S.store = L.makeStore(S.run); go('store'); }
    else { S.dockHeal = L.dock(S.run); go('dock'); }
  }
  function finishNode() {
    logDone();
    var up = L.afterNode(S.run);
    resetUi();
    if (up) toast('Jump gate cleared: Sector ' + S.run.sector);
    go('hangar');
  }
  // ---------- Run report ----------
  // A compact trail of what happened, so a finished or broken run can be pasted
  // into a bug report instead of described from memory. The seed makes it replayable.
  function logNode(type) {
    if (!S.run) return;
    S.log.push({ sec: S.run.sector, jump: S.run.jump, node: type });
  }
  function logDone(outcome) {
    var e = S.log[S.log.length - 1];
    if (!e || !S.run) return;
    if (outcome) e.out = outcome;
    e.hull = S.run.hull;
    e.scrap = S.run.scrap;
    e.crew = S.run.crew.length;
    e.relics = (S.run.relics || []).length;
  }
  function runReport() {
    var s = S.run, d = L.derive(s);
    return {
      game: 'Escape to Vega',
      cache: 'vega-v5',
      when: new Date().toISOString(),
      seed: s.seed,
      difficulty: (s.diff || 0) + ' ' + L.diffOf(s).name,
      outcome: s.won ? 'won' : s.dead ? 'lost' : 'in progress',
      at: 'sector ' + s.sector + ', jump ' + s.jump,
      hull: s.hull + '/' + L.maxHull(s),
      scrap: s.scrap,
      ship: { shieldLv: s.shieldLv, engineLv: s.engineLv, bunks: s.cap, slots: s.slots },
      weapons: s.weapons.slice(),
      crew: s.crew.map(function (m) { return m.role + '/' + m.origin + ' ' + m.stars + '*'; }),
      relics: (s.relics || []).slice(),
      derived: {
        shieldMax: d.shieldMax, bonusShields: d.bonusShields, evasion: d.evasion,
        chargeMul: +d.chargeMul.toFixed(3), shieldRegen: +d.shieldRegen.toFixed(2),
        repairEvery: d.repairEvery, boarding: d.boarding
      },
      stats: s.stats,
      ua: navigator.userAgent,
      log: S.log
    };
  }
  function viewExport() {
    return topBar() +
      panel('Run Report', 'for bug reports', '<p class="note pad">Copied to the clipboard if your browser allowed it. Otherwise tap the box, select all, and copy.</p>' +
        '<textarea class="exportbox" readonly rows="14">' +
        S.exportText.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</textarea>') +
      footBar('Seed ' + S.run.seed + ' replays this run.', '<button class="btn btn-primary" data-a="exportback">Back ' + ic('i-go') + '</button>');
  }
  function toast(msg) {
    var box = document.getElementById('toasts'), el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    box.appendChild(el);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2700);
  }
  var VIEWS = { 'export': viewExport, title: viewTitle, hangar: viewHangar, map: viewMap, combat: viewCombat, reward: viewReward, event: viewEvent, store: viewStore, replace: viewReplace, dock: viewDock, over: viewOver, win: viewWin };
  function render() {
    if (S.screen !== 'title' && !S.run) S.screen = 'title';
    document.getElementById('app').innerHTML = VIEWS[S.screen]();
    if (S.screen === 'combat') {
      bindCombat();
      drawCombat(S.combat);
      if (S.combat.over) onCombatOver(); else startLoop();
    } else loopId++;
    if (S.screen === 'hangar' || S.screen === 'map') saveRun();
  }
  function go(screen) {
    var changed = S.screen !== screen;
    S.screen = screen;
    render();
    if (changed) window.scrollTo(0, 0);
  }

  var ACTIONS = {
    'new': function () { S.run = L.newRun(pickedDiff()); S.log = []; resetUi(); go('hangar'); },
    'diff': function (v) { var n = Math.min(+v, unlocked()); put(DIFF_KEY, n); render(); },
    'continue': function () { var r = savedRun(); if (!r) { render(); return; } S.run = r; resetUi(); go('hangar'); },
    'title': function () { resetUi(); go('title'); },
    'export': function () {
      if (!S.run) return;
      S.exportText = JSON.stringify(runReport(), null, 2);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(S.exportText).then(function () { toast('Run report copied'); }, function () {});
        }
      } catch (e) { /* the textarea fallback covers it */ }
      go('export');
    },
    'exportback': function () { S.exportText = null; go(S.run.dead ? 'over' : S.run.won ? 'win' : 'hangar'); },
    'map': function () { S.sel = { crew: null, weapon: null }; go('map'); },
    'hangar': function () { go('hangar'); },
    'jump': function (v) {
      var j = L.jumpTo(S.run, +v);
      if (!j) return;
      if (j.interest) toast('Interest: +' + j.interest + ' scrap');
      enterNode(j.type);
    },
    'buy': function (v) {
      var r = L.buyCrew(S.run, +v);
      if (!r) return;
      toast(r.merged ? r.member.name + ' merges: now ' + r.member.stars + ' stars' : r.member.name + ' is on board');
      render();
    },
    'reroll': function () { if (L.reroll(S.run)) render(); },
    'upg': function (v) { if (L.upgrade(S.run, v)) render(); },
    'selcrew': function (v) { S.sel.crew = S.sel.crew === +v ? null : +v; render(); },
    'sellcrew': function (v) {
      var m = S.run.crew.filter(function (x) { return x.id === +v; })[0];
      var got = L.sellCrew(S.run, +v);
      if (got) toast((m ? m.name : 'Crew member') + ' disembarks: +' + got + ' scrap');
      S.sel.crew = null; render();
    },
    'selw': function (v) { S.sel.weapon = S.sel.weapon === +v ? null : +v; render(); },
    'sellw': function (v) { var got = L.sellWeapon(S.run, +v); if (got) toast('Weapon removed: +' + got + ' scrap'); S.sel.weapon = null; render(); },
    'speed': function (v) {
      S.speed = +v; put(SPEED_KEY, S.speed);
      document.querySelectorAll('.speed button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-v') === S.speed)); });
    },
    'flee': function () { if (S.combat) L.flee(S.combat); },
    'cdone': function () {
      var r = S.result, c = S.combat;
      if (!r) return;
      S.combat = null; loopId++;
      if (r.dead) { go('over'); return; }
      if (r.boss) { go('win'); return; }
      if (r.fled) { finishNode(); return; }
      S.reward = { name: c.e.name, scrap: r.scrap, healed: r.healed, loot: r.loot, taken: null };
      go('reward');
    },
    'loot': function (v) {
      var o = S.reward.loot[+v];
      var r = L.takeLoot(S.run, o);
      if (r.full) { toast('No room on board'); return; }
      if (r.replace) { S.replace = { k: r.replace, refund: 0, back: 'reward' }; go('replace'); return; }
      S.reward.taken = describeTaken(o, r);
      render();
    },
    'lootskip': function () { S.reward.taken = 'You leave the loot drifting.'; render(); },
    'rdone': function () { finishNode(); },
    'ev': function (v) {
      var out = L.chooseEvent(S.run, S.event, +v);
      if (!out) return;
      S.eventOut = out;
      if (out.replace) { S.replace = { k: out.replace, refund: 0, back: 'event' }; go('replace'); return; }
      render();
    },
    'evfight': function () { var o = S.eventOut.combat; startFight(o.type, o); },
    'evdone': function () { finishNode(); },
    'sbuy': function (v) {
      var r = L.storeBuy(S.run, S.store, +v);
      if (!r) return;
      if (r.replace) { S.replace = { k: r.replace, refund: r.refund, back: 'store', offer: +v }; go('replace'); return; }
      toast(L.WEAPONS[S.store.offers[+v].k].name + ' is installed');
      render();
    },
  'sbuyrel': function () {
    var r = L.storeBuyRelic(S.run, S.store);
    if (!r) return;
    toast(r.relic.name + ' bolted on');
    render();
  },
    'srep': function () { if (L.repair(S.run)) render(); },
    'sslot': function () { if (L.buySlot(S.run)) { toast('Fourth weapon slot installed'); render(); } },
    'sdone': function () { finishNode(); },
    'rep': function (v) {
      var rp = S.replace, old = S.run.weapons[+v];
      var got = L.replaceWeapon(S.run, +v, rp.k);
      toast(L.WEAPONS[rp.k].name + ' replaces ' + L.WEAPONS[old].name + ': +' + got + ' scrap');
      if (rp.back === 'reward') S.reward.taken = L.WEAPONS[rp.k].name + ' is installed.';
      S.replace = null;
      go(rp.back);
    },
    'repskip': function () {
      var rp = S.replace;
      if (rp.back === 'store' && rp.refund) { S.run.scrap += rp.refund; S.store.offers[rp.offer].sold = false; }
      if (rp.back === 'reward') S.reward.taken = 'You leave ' + L.WEAPONS[rp.k].name + ' drifting.';
      if (rp.back === 'event') S.eventOut.text += ' You leave the weapon behind.';
      S.replace = null;
      go(rp.back);
    },
    'ddone': function () { finishNode(); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-a')];
    if (fn) { e.preventDefault(); fn(el.getAttribute('data-v')); }
  });
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('more')) S.synOpen = e.target.open;
  }, true);

  // For automated tests
  window.FNV = {
    S: S, L: L,
    act: function (a, v) { ACTIONS[a](v == null ? null : String(v)); },
    finishCombat: function () { var c = S.combat; if (!c) return; while (!c.over) L.stepCombat(c, STEP); }
  };

  function start(data) {
    var sp = get(SPEED_KEY);
    if (sp === 1 || sp === 2 || sp === 4) S.speed = sp;
    if (data && data.run && data.run.v === 1 && !data.run.dead && !data.run.won) {
      S.run = data.run;
      S.screen = data.screen === 'map' ? 'map' : 'hangar';
    } else S.screen = 'title';
    render();
  }
  var hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(function () {
      return S.run && !S.run.dead && !S.run.won && (S.screen === 'hangar' || S.screen === 'map') ? { run: S.run, screen: S.screen } : {};
    });
  } catch (e) { /* no snapshot */ }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
